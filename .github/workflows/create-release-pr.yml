name: Create Release Branch and PR

on:
  workflow_dispatch: # 手動実行のみ

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    steps:
      # リポジトリを全履歴でチェックアウト
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gitユーザー情報を設定
      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # 日付情報からリリースブランチ名・PRタイトル用文字列を生成
      - name: Generate branch name
        id: date
        run: |
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "year_month=$(date +'%Y年%m月')" >> $GITHUB_OUTPUT

      # developからリリースブランチを作成してpush
      - name: Create release branch
        run: |
          git fetch origin
          git checkout develop
          git pull
          BRANCH_NAME="release/${{ steps.date.outputs.date }}"
          if git ls-remote --exit-code --heads origin $BRANCH_NAME; then
            echo "既にリリースブランチ $BRANCH_NAME が存在するため作成をスキップします。"
          else
            git checkout -b $BRANCH_NAME
            git push origin $BRANCH_NAME
          fi

      # GitHub CLIとjqをインストール
      - name: Install GitHub CLI
        run: sudo apt-get install -y gh jq
          
      # リリースノート生成（インラインでPR番号ごとにRedmineリンク付きでまとめる＋ラベル一覧も出力）
      - name: Generate release notes inline
        id: release_notes
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          PR_LIST=$(git log --merges --pretty=format:"%s" origin/main..origin/develop | grep -E 'Merge pull request' | sed -E 's/Merge pull request #([0-9]+) from .*/\1/')
          declare -A pr_groups
          declare -A pr_links
          declare -A label_set
          others=""
          release_notes="## リリースに含まれる変更\n"
          for pr in $PR_LIST; do
            branch=$(gh pr view $pr --json headRefName -q .headRefName)
            pr_link="https://github.com/${{ github.repository }}/pull/$pr"
            # ラベル取得
            labels=$(gh pr view $pr --json labels -q '.labels[].name' 2>/dev/null)
            label_str=""
            if [ -n "$labels" ]; then
              while IFS= read -r label; do
                [ -n "$label" ] && label_set["$label"]=1
              done <<< "$labels"
              # ラベルをカンマ区切りで1行にまとめる
              label_str="$(echo "$labels" | paste -sd "," -)"
            fi
            # PRごとのラベル情報を保存
            pr_labels["$pr"]="$label_str"
            if [[ "$branch" =~ redmine-([0-9]+) ]]; then
              num="${BASH_REMATCH[1]}"
              pr_groups["$num"]+="$pr "
              pr_links["$pr"]="$pr_link"
            else
              others+="$pr "
              pr_links["$pr"]="$pr_link"
            fi
          done
          for num in $(printf "%s\n" "${!pr_groups[@]}" | sort -n); do
            redmine_link="https://artisan.cloud.redmine.jp/issues/${num}"
            release_notes+="\n### [redmine-$num]($redmine_link)\n"
            for pr in ${pr_groups[$num]}; do
              label_info=""
              if [ -n "${pr_labels[$pr]}" ]; then
                label_info="（labels: ${pr_labels[$pr]}）"
              fi
              release_notes+="* ${pr_links[$pr]} $label_info\n"
            done
          done
          if [ -n "$others" ]; then
            release_notes+="\n### その他\n"
            for pr in $others; do
              label_info=""
              if [ -n "${pr_labels[$pr]}" ]; then
                label_info="（labels: ${pr_labels[$pr]}）"
              fi
              release_notes+="* ${pr_links[$pr]} $label_info\n"
            done
          fi
          # ラベル一覧を改行区切りで出力
          all_labels=""
          for label in "${!label_set[@]}"; do
            all_labels+="$label\n"
          done
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          echo -e "$release_notes" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "pr_labels<<EOF" >> $GITHUB_OUTPUT
          echo -e "$all_labels" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # mainからdevelopまでのPR番号一覧を取得（src/BusForecast.Database配下の変更があるPRのみ抽出）
# mainからreleaseまでのPR番号一覧を取得（src/BusForecast.Database配下の変更があるPRのみ抽出）
      - name: Collect merged PR numbers (Database only)
        id: prs_database
        run: |
            dbprs=""
            # テーブルごとのINSERT文を連想配列で格納
            declare -A inserts_by_table
            # DataFactory連携対象テーブル
            datafactory_tables=(Tbl_XXX)
            datafactory_changed=0
            for sha in $(git log --merges --pretty=format:"%H" origin/main..origin/develop); do
              files=$(git show -m --name-only --pretty="" $sha 2>/dev/null) || true
              echo "changed files: $files"
              msg=$(git log -1 --pretty=format:"%s" $sha)
              if echo "$msg" | grep -q "Merge pull request"; then
                if echo "$files" | grep -q "^src/DB/"; then
                  echo "コミットメッセージ: $msg"
                  pr=$(echo "$msg" | grep -oE 'Merge pull request #[0-9]+' | grep -oE '[0-9]+')
                  echo "抽出PR番号: $pr"
                  if [ -n "$pr" ]; then
                    dbprs="$dbprs* https://github.com/${{ github.repository }}/pull/$pr\n"
                    echo "URL追加: https://github.com/${{ github.repository }}/pull/$pr"
                    # DB配下のSQLファイルのINSERT文をテーブルごとに抽出
                    for f in $files; do
                      if [[ "$f" =~ ^src/DB/.*\.sql$ ]]; then
                        echo "→ SQLファイルの可能性があります: $f"
                        git show $sha -- $f | grep '^+' | grep -E 'INSERT INTO|--INSERT INTO' | sed 's/^+//' | while read -r line; do
                          echo "Processing line: $line"
                          tbl=$(echo "$line" | sed -E 's/.*INSERT INTO \[[^]]+\]\.\[([^]]+)\].*/\1/')
                          if [ -n "$tbl" ]; then
                            echo "→ テーブル名抽出成功: $tbl"
                            inserts_by_table["$tbl"]+="${line#--}"$'\n'
                          fi
                        done
                        # DataFactory連携テーブルの変更有無を判定
                        for tblname in "${datafactory_tables[@]}"; do
                          if [[ "$f" =~ $tblname\.sql$ ]]; then
                            echo "→ DataFactory連携テーブルの変更検出: $tblname"
                            datafactory_changed=1
                          fi
                        done
                      fi
                    done
                  fi
                else
                  echo "DB配下の変更なし"
                fi
              else
                  echo "Merge pull requestを含まないコミットメッセージのためスキップ"
              fi
            done
            echo "prs_database<<EOF" >> $GITHUB_OUTPUT
            echo -e "$dbprs" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            # テーブルごとのINSERT文を出力（環境変数にセット）
            inserts_by_table_str=""
            for tbl in "${!inserts_by_table[@]}"; do
              inserts_by_table_str+="[$tbl]\n${inserts_by_table[$tbl]}\n"
            done
            echo "db_inserts_by_table<<EOF" >> $GITHUB_OUTPUT
            echo -e "$inserts_by_table_str" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            # DataFactory連携テーブル変更有無を出力
            echo "datafactory_changed=$datafactory_changed" >> $GITHUB_OUTPUT

      # 発行対象プロジェクト一覧を判定
      - name: Determine build targets
        id: determine-build
        shell: pwsh
        run: |
          # プロジェクト定義リスト
          $projects = @(
            @{ name = "Aアプリ"; path = @("src/A", "src/B"); workflow = "A_stg_publish.yml" },
            # @{ name = "Bアプリ"; path = @("src/B"); workflow = "B_stg_publish.yml" },
            @{ name = "Cアプリ"; path = @("src/C"); workflow = "C_stg_publish.yml" }
          )
          # developとの差分ファイルから対象プロジェクト抽出
          $changedFiles = git diff --name-only origin/main HEAD
          $targets = @()
          foreach ($project in $projects) {
            foreach ($p in $project.path) {
              if ($changedFiles | Where-Object { $_ -match "$p/*" }) {
                if (-not ($targets | Where-Object { $_.name -eq $project.name })) {
                  $targets += $project
                  break
                }
              }
            }
          }
          # JSON化して環境変数に格納
          $targetsJson = $targets | ConvertTo-Json -Compress
          "BUILD_TARGETS=$targetsJson" | Out-File -FilePath $env:GITHUB_ENV -Append

      # PR本文生成（対象プロジェクト一覧＋workflow_dispatchボタン＋含まれるPRのラベルをすべて付与）
      - name: Create PR
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          $targets = $env:BUILD_TARGETS | ConvertFrom-Json
          $projectList = ""
          foreach ($t in $targets) {
            $workflowUrl = "https://github.com/${{ github.repository }}/actions/workflows/$($t.workflow)"
            $projectList += "* $($t.name) [ステージング発行]($workflowUrl)`n"
          }
          $title = "${{ steps.date.outputs.year_month }}リリース"
          $dbList = "${{ steps.prs_database.outputs.prs_database }}"
          $releaseNotes = "${{ steps.release_notes.outputs.release_notes }}"
          $body = "## 概要`n${{ steps.date.outputs.year_month }}リリース`n## チケットへのリンク`n* `n$releaseNotes`n## DB変更内容`n$dbList`n## 発行対象プロジェクト`n$projectList"

          # release_notesステップで収集したラベルを利用
          $allLabels = @()
          $labelsRaw = "${{ steps.release_notes.outputs.pr_labels }}"
          if ($labelsRaw) {
            $allLabels = $labelsRaw -split "`n" | Where-Object { $_ -ne "" } | Select-Object -Unique
          }
          $labels = if ($allLabels.Count -gt 0) { $allLabels -join ',' } else { '' }
          Write-Host "labelArgs: $labelArgs"

          # PR作成
          # $cmd = "gh pr create --base main --head release/${{ steps.date.outputs.date }} --title "$title" --body "$body" "${labelArgs[@]}"
          # Write-Host "PR作成コマンド: $cmd"
          # gh pr create --base main --head release/${{ steps.date.outputs.date }} --title "$title" --body "$body" "${labelArgs[@]}"
          gh pr create --base main --head release/${{ steps.date.outputs.date }} --title "$title" --body "$body" --label $labels
          
          # Invoke-Expression $cmd

      - name: Create Release Work Issue
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          $targets = $env:BUILD_TARGETS | ConvertFrom-Json
          $deployList = ""
          $datafactoryChanged = "${{ steps.prs_database.outputs.datafactory_changed }}"
          $dbInserts = "${{ steps.prs_database.outputs.db_inserts_by_table }}"
          $deployTargets = @(
            @{ name = "Aアプリ"; workflow = "A_stg_publish.yml" },
            @{ name = "Bアプリ"; workflow = "B_stg_publish.yml" },
            @{ name = "Cアプリ"; workflow = "C_stg_publish.yml" }
          )
          foreach ($d in $deployTargets) {
            foreach ($t in $targets) {
              if ($t.workflow -eq $d.workflow) {
                $deployList += "- [ ] $($d.name)`n"
                break
              }
            }
          }
          $dbChanged = if ("${{ steps.prs_database.outputs.prs_database }}" -ne "") { "- [ ] データベース定義を変更" } else { "" }
          $issueTitle = "${{ steps.date.outputs.year_month }}リリース作業"
          $issueBody = @"
          
          ## 事前に本番環境で行う作業
          $dbChanged

          - データパッチ
            $(if ($dbInserts -ne "") { $dbInserts } else { "  - なし" })
          - Azure Data Factory の設定変更
            - $(if ($datafactoryChanged -eq "1") { "あり" } else { "なし" })
          
          ## リリース時間前に行う作業
          1. ビッグテーブル更新
             - なし
               - を流すのを忘れないこと  
                 ※Alter Table をする時には不要  
          
          2. ステージング環境にデプロイ
          $deployList
          
          ## リリース
          1. DB 定義の更新、または、データパッチ ※「事前に本番環境で行う作業」でやってないならここでやる
            - ※確認
          
          2. アプリケーション(環境)変数の設定
            - ※
          3. スワップ
          $deployList
          
          4. 動作確認
            - [ ] 動作
          5. に定義変更があるときには Azure DataFactory にも反映
            - $(if ($datafactoryChanged -eq "1") { "[ ] あり" } else { "なし" })
          
          ## リリース後に行う作業
          * [ ] の Git リポジトリ整理
            - `main` ブランチから `develop` にマージするプルリクをマージ
          * [ ] Teamsに完了報告をする
          * [ ] ステージング環境に `develop` ブランチをデプロイ
          $deployList
          * [ ] 本Issueをクローズする
          "@
              gh issue create --title "$issueTitle" --body "$issueBody"